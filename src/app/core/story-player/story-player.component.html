<div (click)="advancePlayer($event)">
    <canvas
        #decision
        width="1024px"
        height="576px"
        [style.z-index]="0"
    ></canvas>
    <canvas
        #dialogs
        width="1024px"
        height="576px"
        [style.z-index]="-1"
    ></canvas>
    <canvas
        #overlay
        width="1024px"
        height="576px"
        [style.z-index]="-2"
    ></canvas>
    <canvas #image width="1024px" height="576px" [style.z-index]="-3"></canvas>
    <canvas
        #characters
        width="1024px"
        height="576px"
        [style.z-index]="-4"
    ></canvas>
    <canvas
        #bg_img
        width="1024px"
        height="576px"
        [style.z-index]="-5"
        [style.background-color]="'black'"
    ></canvas>
</div>
